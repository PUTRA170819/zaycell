<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecondCell | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/CSS/style_login.css">
</head>
<body>

    <main class="login-page">

        <!-- =========================
            LOGIN CARD
        ========================== -->
        <section class="login-card">

        <!-- =========================
            BAGIAN KIRI
        ========================== -->
        <div class="login-visual">
            <div class="login-visual-content">
                    <sh1 class="login-visual-title">Selamat Datang</sh1>

                    <p class="login-visual-description">
                        Silahkan Login Untuk Melanjutkan<br>Belanja Di Second Cell
                    </p>

                    <img
                        src="/asset/GAMBAR 1.png" alt="Produk Second Cell" class="login-visual-image"
                    >

                </div>

            </div>


            <!-- =========================
                BAGIAN KANAN
            ========================== -->
            <div class="login-form-section">

                <div class="login-form-container">

                    <h2 class="login-form-title">Login</h2>


                    <!-- FORM -->
                    <form class="login-form">

                        <!-- EMAIL -->
                        <div class="form-group">
                            <label for="email" lass="form-label">Email Atau No. Hp</label>

                            <input
                                type="text"
                                id="email"
                                class="form-input"
                                placeholder="Masukan Email Atau No.Hp"
                            >

                        </div>


                        <!-- PASSWORD -->
                        <div class="form-group">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Masukan Password"
                            >

                            <div class="forgot-password">
                                <a href="#">Lupa Password?</a>
                            </div>
                            <div class="daftar-akun">
                                <a href="register.html">Registrasi</a>
                            </div>

                        </div>


                        <!-- BUTTON LOGIN -->
                        <button
                            type="submit"
                            class="login-button"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
